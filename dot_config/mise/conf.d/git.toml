# グローバルタスク: Git・herdr worktree
# プロジェクト側に同じ名前のタスクがあれば、そちらが優先される

[tasks.unstash]
description = "インデックスを保持したまま、未追跡ファイルを含む変更を stash する"
dir = "{{cwd}}"
run = "git stash push --keep-index -u"

[tasks.'wt:list']
description = "worktree と herdr workspace の対応を、dev ポートの slot と合わせて一覧表示する"
dir = "{{cwd}}"
shell = "bash -c"
run = """
set -euo pipefail
herdr worktree list --cwd "$PWD" | jq -r '.result.worktrees[] | [(.open_workspace_id // "-"), (if .is_linked_worktree then "-" else "0" end), .branch, .path] | @tsv' |
  while IFS=$'\\t' read -r ws slot branch path; do
    [ "$slot" != - ] || slot="$(sed -n 's/^PORT_SLOT=//p' "$path/.ports.env" 2>/dev/null || true)"
    printf '%s\\t%s\\t%s\\t%s\\n' "$ws" "${slot:--}" "$branch" "$path"
  done
"""
