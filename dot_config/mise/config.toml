[tools]
bun = "latest"
node = "latest"
"npm:npkill" = "latest"
pnpm = "latest"
"npm:@github/copilot" = "latest"
"npm:@googleworkspace/cli" = "latest"
"npm:@playwright/cli" = "latest"
actionlint = "latest"
herdr = "latest"
"aqua:fullstorydev/grpcurl" = "latest"
"npm:druk" = "latest"
chezmoi = "latest"
hunk = "latest"
"npm:concurrently" = "latest"

[settings]
idiomatic_version_file_enable_tools = ["node"]

# グローバルタスクはカテゴリ別に conf.d/*.toml に置く (名前順に読み込まれる)
# 長いスクリプトは tasks/ 配下のファイルタスクに置く (例: tasks/pw/pdf → pw:pdf)
