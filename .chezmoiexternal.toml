# oh-my-zsh and its custom plugins/themes are fetched from upstream.
# Update with `chezmoi apply -R` (or wait for refreshPeriod to elapse).
[".oh-my-zsh"]
    type = "archive"
    url = "https://github.com/ohmyzsh/ohmyzsh/archive/master.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"

[".oh-my-zsh/custom/plugins/zsh-autosuggestions"]
    type = "archive"
    url = "https://github.com/zsh-users/zsh-autosuggestions/archive/master.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"

[".oh-my-zsh/custom/plugins/zsh-syntax-highlighting"]
    type = "archive"
    url = "https://github.com/zsh-users/zsh-syntax-highlighting/archive/master.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"

[".oh-my-zsh/custom/themes/powerlevel10k"]
    type = "archive"
    url = "https://github.com/romkatv/powerlevel10k/archive/master.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"

# Windows: Alt 空打ちで IME を切り替える alt-ime-ahk (mise win apply で展開)
["Documents/AutoHotkey/alt-ime-ahk.exe"]
    type = "archive-file"
    url = "https://github.com/karakaram/alt-ime-ahk/releases/download/v0.4.6/alt-ime-ahk.zip"
    path = "alt-ime-ahk.exe"
    checksum.sha256 = "3838551e8b9fb65504e8e9af3d9b38b147e9b5af2a651f65b92ba727a95634b2"
