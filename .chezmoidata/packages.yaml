# Packages installed by the run_onchange scripts in .chezmoiscripts/.
# Grouped by OS, then by package manager. Editing this file re-runs the
# matching install script on the next apply.
#   common, darwin, linux: brew (10-brew-bundle), selected by .chezmoi.os,
#                          applied with `chezmoi apply`
#   windows:               winget (20-winget-install), selected by the
#                          Windows destination, applied with `mise win apply`
packages:
  common:
    brew:
      formulae:
        - act
        - bat
        - eza
        - gh
        - git-delta
        - jq
        - lazygit
        - mise
        - sqlite
        - uv
      casks:
        - codex
  linux:
    brew:
      formulae:
        - bubblewrap
  # Package IDs from `winget.exe search <name>`.
  windows:
    winget:
      # Development
      - Git.Git
      - Microsoft.VisualStudioCode
      - Microsoft.WindowsTerminal
      - Microsoft.PowerShell
      - Microsoft.WSL
      - Docker.DockerDesktop
      - Postman.Postman
      # Keyboard / utilities
      - AutoHotkey.AutoHotkey
      - Microsoft.PowerToys
      # Browser / AI
      - Google.Chrome.EXE
      - Anthropic.Claude
      - OpenAI.ChatGPT
      # Meetings
      - Zoom.Zoom.EXE
      - Microsoft.Teams
